# ============================================================
#  netlify.toml — Synoûs
#  Security headers pour synous.be
#  Fonts auto-hébergées, Lucide (unpkg), vidéos YouTube/Vimeo
# ============================================================

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]

    # Empêche le clickjacking
    X-Frame-Options = "SAMEORIGIN"

    # Empêche le MIME sniffing
    X-Content-Type-Options = "nosniff"

    # Force HTTPS pour 1 an
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Contrôle les infos envoyées aux sites tiers
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Désactive les fonctionnalités navigateur inutiles
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    # Content Security Policy
    # 'unsafe-inline' nécessaire pour les scripts inline (animations, Lucide, etc.)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://js.hcaptcha.com https://newassets.hcaptcha.com; style-src 'self' 'unsafe-inline' https://newassets.hcaptcha.com; font-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://newassets.hcaptcha.com; img-src 'self' data: https:; connect-src 'self' https://unpkg.com https://hcaptcha.com https://*.hcaptcha.com; frame-ancestors 'self';"
